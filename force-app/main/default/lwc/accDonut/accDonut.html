<template>
  <div class="donut" style={rootStyle} title={tooltip}>
    <svg
      class="donut__svg"
      viewBox="0 0 120 120"
      aria-hidden="true"
      focusable="false"
    >
      <g transform="rotate(-90 60 60)">
        <circle class="donut__track" cx="60" cy="60" r="52"></circle>
        <template for:each={arcs} for:item="arc">
          <circle
            key={arc.key}
            class="donut__arc"
            cx="60"
            cy="60"
            r="52"
            style={arc.style}
          ></circle>
        </template>
      </g>
    </svg>
    <div class="donut__center">
      <span class="donut__value" style={valueStyle}>{displayValue}</span>
      <template lwc:if={sublabel}>
        <span class="donut__sub">{sublabel}</span>
      </template>
    </div>
    <span class="acc-sr-only">{assistiveLabel}</span>
  </div>
</template>
